name: MuBox-Slim v1.0.3 vc51 Review Candidate
on:
  push:
    branches: ["release/v1.0.3-vc51"]
    paths:
      - "app/**"
      - ".github/workflows/vc51-candidate.yml"
permissions:
  contents: read
concurrency:
  group: mubox-slim-v103-vc51-review-candidate
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout candidate source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify candidate source is based on main and cleanly checked out
        env:
          BASE_SOURCE_COMMIT: 5554256f79d72b70af884cd0b126e5024be5aeb1
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$BASE_SOURCE_COMMIT" HEAD
          git diff --check "$BASE_SOURCE_COMMIT"...HEAD
          echo "candidate source commit: $GITHUB_SHA"
      - name: Decode binary assets from base64 sidecars
        run: |
          set -euo pipefail
          mkdir -p app/src/main/res/drawable-xxxhdpi gradle/wrapper
          base64 -d v101-assets/halo_cat.webp.b64 > app/src/main/res/drawable-xxxhdpi/halo_cat.webp
          base64 -d v101-assets/ic_launcher_foreground.png.b64 > app/src/main/res/drawable-xxxhdpi/ic_launcher_foreground.png
          base64 -d v101-assets/gradle-wrapper.jar.b64 > gradle/wrapper/gradle-wrapper.jar
          echo "6e50bcee9407aa223a1f330e8993572d5989c956f3d8c7ea2ec984c981769164  app/src/main/res/drawable-xxxhdpi/halo_cat.webp" | sha256sum -c -
          echo "497c8c2a7e5031f6aa847f88104aa80a93532ec32ee17bdb8d1d2f67a194a9c7  gradle/wrapper/gradle-wrapper.jar" | sha256sum -c -
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r28c
          add-to-path: true
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Download and verify the approved reconstructed AAR
        env:
          EXPECTED_AAR_SHA256: 7640efe404ab8cb8535e0a4899a1b6dc3b2e5a94009a33cd6f6383dc9035bbfa
          AAR_URL: https://54321-i4pg3l4bdsb4o0hvlh6kz-95067deb.us2.manus.computer/download/libbox-7640efe404ab8cb8535e0a4899a1b6dc3b2e5a94009a33cd6f6383dc9035bbfa.aar
        run: |
          set -euo pipefail
          mkdir -p app/libs
          curl --fail --location --silent --show-error --retry 5 --retry-delay 2 "$AAR_URL" -o app/libs/libbox.aar
          echo "$EXPECTED_AAR_SHA256  app/libs/libbox.aar" | sha256sum -c -
          stat -c 'AAR input size: %s bytes' app/libs/libbox.aar
      - name: Decode release signing keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          base64 -d .github/signing/keystore.enc.b64 | openssl enc -d -aes-256-cbc -pbkdf2 -pass env:KEYSTORE_PASSWORD > "$GITHUB_WORKSPACE/release.keystore"
          test "$(stat -c%s "$GITHUB_WORKSPACE/release.keystore")" -gt 1000
      - name: Run unit tests
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest -PabiOnly=arm64-v8a
      - name: Build signed review APK
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          VERSION_NAME: v1.0.3
          VERSION_CODE: "51"
        run: |
          set -euo pipefail
          ./gradlew :app:assembleRelease -PabiOnly=arm64-v8a
          mkdir -p dist
          APK=$(find app/build/outputs/apk/release -type f -name '*.apk' -print -quit)
          test -n "$APK" && test -s "$APK"
          cp "$APK" dist/app-arm64-v8a-release.apk
      - name: Audit candidate package, signature, integrity, and metadata
        env:
          EXPECTED_AAR_SHA256: 7640efe404ab8cb8535e0a4899a1b6dc3b2e5a94009a33cd6f6383dc9035bbfa
          EXPECTED_CERT_SHA256: c0ededcccc0e0e0ee1216a624e7a025f9628dde6c4cdc7aa3de03f14d31ea355
        run: |
          set -euo pipefail
          APK=dist/app-arm64-v8a-release.apk
          BT=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          AAPT="$BT/aapt"
          APKSIGNER="$BT/apksigner"
          unzip -tq "$APK"
          BADGING=$("$AAPT" dump badging "$APK")
          echo "$BADGING" | grep '^package:'
          echo "$BADGING" | grep -q "package: name='com.mubox.slim'" || { echo 'wrong applicationId' >&2; exit 1; }
          echo "$BADGING" | grep -q "versionCode='51'" || { echo 'wrong versionCode' >&2; exit 1; }
          echo "$BADGING" | grep -q "versionName='v1.0.3'" || { echo 'wrong versionName' >&2; exit 1; }
          unzip -Z1 "$APK" | grep -q '^lib/arm64-v8a/libbox.so$' || { echo 'arm64 libbox.so missing' >&2; exit 1; }
          CERT=$("$APKSIGNER" verify --verbose --print-certs "$APK")
          echo "$CERT" | grep -i 'certificate SHA-256 digest:'
          printf '%s\n' "$CERT" | grep -qi "$EXPECTED_CERT_SHA256" || { echo 'signer fingerprint mismatch' >&2; exit 1; }
          APK_SHA256=$(sha256sum "$APK" | awk '{print $1}')
          APK_SIZE=$(stat -c%s "$APK")
          printf 'sourceCommit=%s\npackageName=com.mubox.slim\nversionName=v1.0.3\nversionCode=51\nAAR_SHA256=%s\nAPK_SHA256=%s\nAPK_SIZE_BYTES=%s\nRoot_proxy_behavior=UNVERIFIED (not exercised on a rooted device)\n' "$GITHUB_SHA" "$EXPECTED_AAR_SHA256" "$APK_SHA256" "$APK_SIZE" | tee verify-results.txt
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          apk = Path("dist/app-arm64-v8a-release.apk")
          info = {
              "versionCode": 51,
              "versionName": "v1.0.3",
              "apkName": "app-arm64-v8a-release.apk",
              "apkSize": apk.stat().st_size,
              "apkSha256": hashlib.sha256(apk.read_bytes()).hexdigest(),
              "notes": "候选包含六种协议的协议/传输感知测速及明确口径标签；Root代理行为未在Root设备上验证。",
              "releaseUrl": "https://github.com/smallmu1022-pixel/MuBox-Slim/releases/tag/latest"
          }
          Path("dist/version.json").write_text(json.dumps(info, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
      - name: Upload review-only candidate artifact (no Release publish)
        uses: actions/upload-artifact@v4
        with:
          name: v1.0.3-vc51-review-candidate
          path: |
            dist/app-arm64-v8a-release.apk
            dist/version.json
            verify-results.txt
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
