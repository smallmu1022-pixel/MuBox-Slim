# MuBox Slim 发布构建（单 job）：瘦身内核（sing-box v1.14.2 + slim/kernel-slim.patch 现编）
# → libbox.aar 喂给应用 → 双 ABI APK 附到当前标签的正式发布。
name: Release Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout MuBox Slim
        uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 0

      - name: Checkout sing-box v1.14.2
        uses: actions/checkout@v4
        with:
          repository: SagerNet/sing-box
          ref: v1.14.2
          path: sing-box

      - name: Apply kernel slim patch
        working-directory: sing-box
        run: |
          git apply ../slim/kernel-slim.patch
          git diff --stat

      - name: Setup Go 1.26.5
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache: false

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r28c
          add-to-path: true

      - name: Install gomobile v0.1.12 (sagernet fork)
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          go install github.com/sagernet/gomobile/cmd/gomobile@v0.1.12
          gomobile init

      - name: Verify dependency graph (fail fast if a cut package creeps back)
        working-directory: sing-box
        run: |
          TAGS='with_gvisor,with_quic,with_utls,with_clash_api,badlinkname,tfogo_checklinkname0'
          GOOS=android GOARCH=arm64 go list -tags "$TAGS" -deps ./experimental/libbox > /tmp/deps.txt
          if grep -E 'cronet-go|sing-openconnect|sing-openvpn|sing-usbip|wireguard-go|sing-snell|cretz/bine|gliderssh|sing-shadowtls|sing-quic/tuic|golang.org/x/crypto/ssh|sing-shadowsocks|sagernet/tailscale|sing-box/protocol/(tuic|naive|vmess|shadowsocks|shadowtls|snell|ssh|tor|hysteria$|tailscale|openvpn|openconnect|wireguard)|sing-box/service/(ssmapi|usbip)' /tmp/deps.txt; then
            echo 'ERROR: a cut package is back in the libbox dependency graph' >&2
            exit 1
          fi
          for pkg in 'sagernet/quic-go' 'sing-quic/hysteria2' 'metacubex/utls' 'gvisor' 'sing-box/experimental/clashapi' 'sing-box/protocol/vless' 'sing-box/protocol/hysteria2' 'sing-box/protocol/trojan' 'sing-box/protocol/anytls'; do
            grep -q "$pkg" /tmp/deps.txt || { echo "ERROR: retained package missing: $pkg" >&2; exit 1; }
          done
          echo "dependency graph OK: $(wc -l < /tmp/deps.txt) packages"

      - name: Build libbox.aar (arm64-v8a + armeabi-v7a)
        working-directory: sing-box
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          CGO_ENABLED: '1'
        run: |
          gomobile bind \
            -o libbox.aar \
            -target android/arm64,android/arm \
            -androidapi 24 \
            -javapkg=io.nekohasekai \
            -libname=box \
            -trimpath \
            -buildvcs=false \
            -ldflags "-X github.com/sagernet/sing-box/constant.Version=1.14.2 -X runtime.godebugDefault=multipathtcp=0,tlssha1=1 -checklinkname=0 -s -w -buildid=" \
            -tags 'with_gvisor,with_quic,with_utls,with_clash_api,badlinkname,tfogo_checklinkname0' \
            ./experimental/libbox

      - name: Report .so sizes (baseline arm64 libbox.so = 67,571,112 bytes)
        working-directory: sing-box
        run: |
          mkdir -p aar-unzip && cd aar-unzip && unzip -o ../libbox.aar > /dev/null
          find . -name 'libbox.so' -exec ls -la {} \;
          ls -la ../libbox.aar

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode Keystore
        run: |
          base64 -d .github/signing/keystore.enc.b64 | openssl enc -d -aes-256-cbc -pbkdf2 -pass pass:"${{ secrets.KEYSTORE_PASSWORD }}" > ${{ github.workspace }}/release.keystore
          KS_BYTES=$(stat -c%s ${{ github.workspace }}/release.keystore)
          echo "keystore_bytes=${KS_BYTES}"
          if [ "$KS_BYTES" -lt 1000 ]; then echo "ERROR: decoded keystore is too small"; exit 1; fi

      - name: Place slim libbox.aar
        run: |
          mkdir -p app/libs
          cp sing-box/libbox.aar app/libs/libbox.aar
          ls -lh app/libs/libbox.aar
          grep -n 'applicationId' app/build.gradle.kts

      - name: Build release APKs
        run: |
          mkdir -p dist
          gradle assembleRelease -PabiOnly=arm64-v8a
          find app/build/outputs/apk/release -type f -name "*.apk" -exec cp {} dist/ \;
          rm -f app/build/outputs/apk/release/*.apk
          gradle assembleRelease -PabiOnly=armeabi-v7a
          find app/build/outputs/apk/release -type f -name "*.apk" -exec cp {} dist/ \;
          ls -lh dist/
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_NAME: ${{ github.ref_name }}

      - name: Publish release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: MuBox Slim ${{ github.ref_name }}
          prerelease: false
          files: dist/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
